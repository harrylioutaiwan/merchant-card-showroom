<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 嵌入範例 · Merchant Card Showroom</title>
  <link rel="stylesheet" href="./embed/merchant-card.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem 3rem; background: #f8f5f7; color: #282326; font: 1rem/1.6 system-ui, sans-serif; border-top: .25rem solid #ce205f; }
    main { max-width: 66rem; margin: auto; }
    a { color: #b71956; text-underline-offset: .22em; }
    h1 { margin-bottom: .2rem; }
    header p { margin-top: 0; color: #645960; }
    .example { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); align-items: start; gap: 1rem; }
    section { padding: 1rem; background: white; border: 1px solid #e9e0e5; border-radius: .6rem; }
    section h2 { margin: 0 0 .75rem; font-size: 1.12rem; }
    #example-card { max-width: 19rem; margin-inline: auto; }
    pre { margin: 0; padding: 1rem; border-radius: .5rem; color: #ffedf5; background: #2c2228; overflow: auto; font-size: .85rem; }
    #card-schema { margin-top: 1rem; }
    dt { font-weight: 700; }
    dd { margin: .15rem 0 .6rem; }
    @media (max-width: 42rem) { .example { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="./">返回 Merchant Card Showroom</a>
      <h1>HTML 嵌入範例</h1>
      <p>在一般 HTML 中載入商品卡模組和樣式，再傳入商品與顯示設定。</p>
    </header>
    <div class="example">
      <section aria-labelledby="example-title">
        <h2 id="example-title">執行結果</h2>
        <div id="example-card"></div>
      </section>
      <section aria-labelledby="source-title">
        <h2 id="source-title">嵌入程式碼</h2>
        <pre><code id="snippet"></code></pre>
      </section>
    </div>
    <section id="card-schema" aria-labelledby="schema-title">
      <h2 id="schema-title">卡片資料結構</h2>
      <dl>
        <dt><code>product</code></dt>
        <dd>共同欄位是 <code>id</code>、<code>name</code>、<code>imageUrl</code>、<code>price</code>。<code>kind</code> 決定排行、限搶或搜尋的業務欄位。</dd>
        <dt><code>layout</code></dt>
        <dd>預設方格（<code>grid</code>）。搜尋卡支援橫列（<code>list</code>）。</dd>
        <dt><code>display</code></dt>
        <dd>選填的顯示開關。值由嵌入頁自行管理。</dd>
      </dl>
    </section>
  </main>
  <script type="module" id="sample-script">
    import { mountMerchantCard } from './embed/merchant-card.js';

    mountMerchantCard(document.querySelector('#example-card'), {
      product: {
        id: 'sample-toothpaste',
        kind: 'search',
        name: '專業抗敏護齦牙膏 100g × 8 入',
        imageUrl: './assets/toothpaste.jpg',
        price: { amount: 1078 },
        promotion: '滿 1 件折 111',
        rating: { score: 4.5, count: 2954 },
        shipping: '最快今天',
        tags: ['登記', '贈品'],
        sold: '總銷量超過 1 萬',
      },
      layout: 'grid',
      display: { showRating: false },
    });
  </script>
  <script>
    const js = document.querySelector('#sample-script').textContent.replace(/^    /gm, '').trim();
    document.querySelector('#snippet').textContent =
      '<link rel="stylesheet" href="./embed/merchant-card.css">\n' +
      '<div id="example-card"></div>\n\n' + '<script type="module">\n' + js + '\n<\/script>';
  </script>
</body>
</html>
