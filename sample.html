<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嵌入範例 · Merchant Card Showroom</title>
  <link rel="stylesheet" href="./showroom.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-content">
      <a class="wordmark" href="./index.html"><span class="brand-mark" aria-hidden="true"></span> Merchant Card Showroom</a>
      <nav aria-label="主要導覽">
        <a href="./index.html">商品卡總覽</a>
        <a href="./sample.html" aria-current="page">嵌入範例</a>
      </nav>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>嵌入商品卡</h1>
      <p>載入元件模組，透過 HTML 元素的屬性傳入商品資料與展示設定。</p>
    </div>
    <div class="embed">
      <section class="preview" aria-labelledby="sample-preview">
        <div class="preview-heading"><h2 id="sample-preview">執行結果</h2></div>
        <div class="preview-frame"><merchant-card id="example-card"></merchant-card></div>
      </section>
      <section class="code-panel" aria-labelledby="sample-source">
        <h2 id="sample-source">使用方式</h2>
        <pre><code id="example-code"></code></pre>
      </section>
    </div>
    <noscript>請啟用 JavaScript 以執行商品卡範例。</noscript>
  </main>

  <script type="module" id="example-script">
    import './js/merchant-card.js';

    const card = document.querySelector('#example-card');
    card.product = {
      id: 'sample-headphones',
      name: '輕量無線降噪耳機',
      category: '3C 配件',
      imageUrl: './assets/headphones.jpg',
      price: { amount: 1290, kind: 'from' },
      rating: { score: 4.6, count: 86 },
    };
    card.settings = { showRating: false };
  </script>
  <script>
    const js = document.querySelector('#example-script').textContent.trim().replace(/^    /gm, '');
    document.querySelector('#example-code').textContent =
      '<merchant-card id="example-card"></merchant-card>\n\n' +
      '<script type="module">\n' + js + '\n<\/script>';
  </script>
</body>
</html>
